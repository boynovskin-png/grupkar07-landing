<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Брошура 2026 – Автокомплекс Групкар-07, с. Труд, Пловдив</title>
<meta name="description" content="Разлистваема брошура на Автокомплекс Групкар-07: експресен ГТП до 3.5 т, автомивка на самообслужване с осмозна вода, сезонна профилактика и приложението Групкар Мобил.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(900px 600px at 50% 0%,#0B1A44 0%,#050A1A 60%) fixed,#050A1A;color:#fff;font-family:'Manrope',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;overflow:hidden}
header{padding:14px 16px 0;text-align:center;font-size:13px;font-weight:800;letter-spacing:.14em;color:#22D3EE}
header span{color:#9AA7C2;font-weight:500;letter-spacing:.04em;margin-left:8px}
main{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0}
.scaler{position:relative;perspective:none;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.book{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .9s cubic-bezier(.65,0,.25,1)}
.leaf{position:absolute;top:0;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.55,.05,.25,1);transform:perspective(2600px) rotateY(0deg)}
.leaf.flipped{transform:perspective(2600px) rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:#050A1A}
.face.back{transform:rotateY(180deg)}
.face::before{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;background:linear-gradient(to right,rgba(0,0,0,.55),rgba(0,0,0,.12) 4%,transparent 14%)}
.face.back::before{background:linear-gradient(to left,rgba(0,0,0,.55),rgba(0,0,0,.12) 4%,transparent 14%)}
.face::after{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;background:#000;opacity:0}
.leaf.turning .face::after{animation:shade 1.1s ease-in-out}
@keyframes shade{0%{opacity:0}45%{opacity:.4}100%{opacity:0}}
.leaf{box-shadow:0 0 0 rgba(0,0,0,0)}
.board{position:absolute;top:0;width:794px;height:1123px;background:linear-gradient(135deg,#0A1330,#050A1A);border:1px solid #1E2A44;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#9AA7C2;font-size:18px;font-weight:700;letter-spacing:.1em;box-shadow:0 30px 70px rgba(0,0,0,.6)}
.board img{width:260px;height:260px;border-radius:50%;opacity:.9}
.shadowbed{position:absolute;top:30px;height:1070px;box-shadow:0 40px 90px rgba(0,0,0,.65);pointer-events:none;transition:opacity .6s}
/* PAGE */
.pg{width:794px;height:1123px;padding:56px;display:flex;flex-direction:column;gap:24px;position:relative;overflow:hidden;color:#fff;background:radial-gradient(620px 420px at 100% 0%,rgba(37,99,235,.28),transparent 70%),radial-gradient(500px 360px at 0% 100%,rgba(34,211,238,.10),transparent 70%),#050A1A}
.pg a{color:inherit;text-decoration:none}
.row{display:flex;justify-content:space-between;align-items:center}
.pill{display:inline-flex;align-self:flex-start;padding:8px 16px;border-radius:999px;border:1px solid #1E3A8A;background:#0B1533;color:#22D3EE;font-size:13px;font-weight:800;letter-spacing:.12em}
.muted{color:#9AA7C2;font-size:14px;font-weight:500}
.h1{font-size:46px;line-height:1.08;font-weight:800;letter-spacing:-.02em;margin:0}
.h1.big{font-size:56px;line-height:1.04}
.cy{color:#22D3EE}
.lead{margin:0;font-size:17px;line-height:1.6;color:#B6C2DB;max-width:640px}
.label{font-size:14px;font-weight:800;letter-spacing:.12em;color:#9AA7C2;margin-top:8px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:#0E1526;border:1px solid #1E2A44;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:17px;font-weight:800}
.card p{margin:0;font-size:13.5px;line-height:1.5;color:#9AA7C2}
.badge{width:32px;height:32px;border-radius:10px;background:#2563EB;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center}
.badge.cyan{background:#22D3EE;color:#050A1A}
.step{flex-direction:row;gap:16px;align-items:flex-start;padding:22px}
.step .badge{flex:none;width:36px;height:36px;font-size:17px;border-radius:12px}
.step div{display:flex;flex-direction:column;gap:6px}
.panel{background:#0E1526;border:1px solid #1E2A44;border-radius:16px;padding:24px 28px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-size:20px;font-weight:800}
.chk{display:flex;gap:12px;font-size:15px;line-height:1.5;color:#D5DEF0}
.chk b{flex:none;color:#22D3EE;font-weight:800}
.cta{margin-top:auto;background:linear-gradient(100deg,#2563EB,#1D4ED8);border-radius:20px;padding:28px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;box-shadow:0 12px 40px rgba(37,99,235,.35)}
.cta h4{margin:0 0 6px;font-size:24px;font-weight:800}
.cta p{margin:0;font-size:15px;color:#DCE7FF}
.btn{background:#fff;color:#0B1533!important;font-size:15px;font-weight:800;padding:14px 22px;border-radius:12px;white-space:nowrap;cursor:pointer;transition:transform .2s}
.btn:hover{transform:scale(1.05)}
.foot{margin-top:auto;display:flex;align-items:center;gap:16px;font-size:14px;font-weight:700;letter-spacing:.1em}
.bar{display:block;height:4px;width:56px;background:#E11D2E;border-radius:2px}
.info{background:#0B1533;border:1px solid #1E3A8A;border-radius:14px;padding:18px 22px;font-size:15px;line-height:1.6;color:#B6C2DB}
.info b{color:#fff}
.photo{border-radius:20px;overflow:hidden;border:1px solid #1E2A44;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.photo img{display:block;width:100%;height:auto}
#snd.off{opacity:.4;text-decoration:line-through}
.num{position:absolute;bottom:22px;right:56px;font-size:12px;color:#5B6A8C;font-weight:700;letter-spacing:.1em}
.logo{display:flex;justify-content:center;margin-top:24px}
.sl{display:flex;align-items:center;gap:16px;font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.28}
.sl i{display:block;flex:none;width:6px;height:36px;border-radius:3px}
.logo img{width:460px;height:460px;border-radius:50%;object-fit:cover;animation:float 5s ease-in-out infinite;box-shadow:0 0 90px rgba(37,99,235,.55)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hint{margin-left:auto;color:#22D3EE;font-size:13px;letter-spacing:.06em;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45;transform:translateX(0)}50%{opacity:1;transform:translateX(6px)}}
.in .rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0)*90ms + 400ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
/* CONTROLS */
nav{display:flex;align-items:center;gap:18px;padding:10px 0 6px}
nav button{width:44px;height:44px;border-radius:50%;border:1px solid #1E3A8A;background:#0B1533;color:#fff;font-size:20px;cursor:pointer;transition:.2s}
nav button:hover:not(:disabled){background:#2563EB}
nav button:disabled{opacity:.3;cursor:default}
.dots{display:flex;gap:8px}
.dots i{width:9px;height:9px;border-radius:50%;background:#1E3A8A;cursor:pointer;transition:.3s}
.dots i.on{background:#22D3EE;width:26px;border-radius:5px}
footer{padding:0 16px 12px;font-size:13px;color:#9AA7C2;text-align:center}
footer a{color:#22D3EE;text-decoration:none;font-weight:700}
</style>
</head>

var PW=794,PH=1123,NP=PAGES.length;
var scaler=document.getElementById('scaler'),book=document.getElementById('book');
var prevB=document.getElementById('prev'),nextB=document.getElementById('next'),dotsEl=document.getElementById('dots');
var mode=null,state=0,leaves=[],pageEls=[],scale=1,busy=false;
function isMobile(){return window.innerWidth<900;}
function maxState(){return mode==='single'?NP-1:Math.ceil(NP/2);}
function mk(i){var d=document.createElement('div');d.className='pg';d.innerHTML=PAGES[i];var rs=d.querySelectorAll('.rise');for(var k=0;k<rs.length;k++)rs[k].style.setProperty('--d',k);pageEls[i]=d;return d;}
function face(cls,i){var f=document.createElement('div');f.className='face '+cls;f.appendChild(mk(i));return f;}
function build(){
  book.innerHTML='';leaves=[];pageEls=[];
  mode=isMobile()?'single':'spread';
  var nl=mode==='single'?NP:Math.ceil(NP/2);
  book.style.width=(mode==='single'?PW:PW*2)+'px';book.style.height=PH+'px';
  if(mode==='spread'){
    var b=document.createElement('div');b.className='board';b.style.left=PW+'px';b.innerHTML='<img src="'+LOGO+'" alt=""><span>GRUPCAR07.COM</span>';book.appendChild(b);
  }
  for(var i=0;i<nl;i++){
    var l=document.createElement('div');l.className='leaf';l.style.left=(mode==='single'?0:PW)+'px';l.style.width=PW+'px';l.style.height=PH+'px';
    if(mode==='single'){l.appendChild(face('front',i));}
    else{l.appendChild(face('front',2*i));if(2*i+1<NP)l.appendChild(face('back',2*i+1));}
    l.style.zIndex=nl-i;book.appendChild(l);leaves.push(l);
  }
  dotsEl.innerHTML='';
  for(var s=0;s<=maxState();s++){(function(s){var d=document.createElement('i');d.onclick=function(e){e.stopPropagation();goTo(s);};dotsEl.appendChild(d);})(s);}
  var maxS=maxState();if(state>maxS)state=maxS;
  layout();apply(true);
}
function layout(){
  var aw=window.innerWidth-24,ah=window.innerHeight-150;
  var bw=mode==='single'?PW:PW*2;
  scale=Math.min(aw/bw,ah/PH);if(scale<0.15)scale=0.15;
  scaler.style.width=(bw*scale)+'px';scaler.style.height=(PH*scale)+'px';
  setShift();
}
function setShift(){
  var shift=0;
  if(mode==='spread'){if(state===0)shift=-PW/2;else if(state===maxState())shift=0;}
  book.style.transform='scale('+scale+') translateX('+shift+'px)';
}
function visiblePages(){
  if(mode==='single')return [state];
  if(state===0)return [0];
  var v=[2*state-1];if(2*state<NP)v.push(2*state);return v;
}
function apply(instant){
  var nl=leaves.length;
  for(var i=0;i<nl;i++){
    var fl=mode==='single'?(i<state):(i<state);
    var was=leaves[i].classList.contains('flipped');
    if(fl!==was){
      var l=leaves[i];
      l.classList.toggle('flipped',fl);
      if(!instant){l.classList.add('turning');l.style.zIndex=200;(function(l,i,fl){setTimeout(function(){l.classList.remove('turning');l.style.zIndex=fl?i+1:nl-i;},1150);})(l,i,fl);}
      else l.style.zIndex=fl?i+1:nl-i;
    } else if(instant){leaves[i].style.zIndex=fl?i+1:nl-i;}
  }
  setShift();
  var vis=visiblePages();
  for(var p=0;p<pageEls.length;p++){if(vis.indexOf(p)>-1)pageEls[p].classList.add('in');else pageEls[p].classList.remove('in');}
  var ds=dotsEl.children;for(var d=0;d<ds.length;d++)ds[d].className=d===state?'on':'';
  prevB.disabled=state===0;nextB.disabled=state===maxState();
}
/* звук на разлистване – синтезиран, без външни файлове */
var AC=null,noiseBuf=null,muted=false;

function noiseB(c){if(!noiseBuf){var n=Math.floor(c.sampleRate*1.2),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;noiseBuf=b;}return noiseBuf;}
function burst(c,t0,dur,f0,f1,peak,q,type){
  var s=c.createBufferSource();s.buffer=noiseB(c);
  var f=c.createBiquadFilter();f.type=type||'bandpass';f.Q.value=q||0.8;
  f.frequency.setValueAtTime(f0,t0);f.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  var g=c.createGain();g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(peak,t0+dur*0.25);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(c.destination);s.start(t0);s.stop(t0+dur+0.05);
}
function playFlip(){
  if(muted)return;var c=actx();if(!c)return;var t=c.currentTime;
  burst(c,t,0.12,3500,5200,0.22,1.2,'highpass');
  burst(c,t+0.05,0.7,900,3200,0.30,0.9,'bandpass');
  burst(c,t+0.80,0.20,600,250,0.22,0.7,'lowpass');
}
document.getElementById('snd').onclick=function(e){e.stopPropagation();muted=!muted;this.classList.toggle('off',muted);if(!muted)playFlip();};
function goTo(s){var m=maxState();if(s<0)s=0;if(s>m)s=m;if(s===state)return;state=s;playFlip();apply(false);}
function next(){goTo(state+1);}function prev(){goTo(state-1);}
prevB.onclick=prev;nextB.onclick=next;
scaler.addEventListener('click',function(e){
  if(e.target.closest('a'))return;
  var r=scaler.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;

  else{if(x>0.4)next();else prev();}
});

scaler.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});
